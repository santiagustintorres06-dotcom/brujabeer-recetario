# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  BrujaBeer Recetario — application.properties                           ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# ── CRÍTICO: Desactivar el servidor web embebido ──────────────────────────────
# Sin esta línea, Spring Boot intentará arrancar Tomcat y fallará porque
# no tenemos spring-boot-starter-web en el pom.xml.
spring.main.web-application-type=none

# ══════════════════════════════════════════════════════════════════════════════
# BASE DE DATOS H2 EMBEBIDA (PORTABLE — NO NECESITA SERVIDOR EXTERNO)
# ══════════════════════════════════════════════════════════════════════════════
# Los datos se guardan en el archivo "brujabeer-data.mv.db" en la carpeta
# desde donde se ejecuta la aplicación. Persistentes entre reinicios.
spring.datasource.url=jdbc:h2:file:./brujabeer-data
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ══════════════════════════════════════════════════════════════════════════════
# OPCIÓN ALTERNATIVA: MySQL (descomentar para usar MySQL en vez de H2)
# ══════════════════════════════════════════════════════════════════════════════
# Requisitos: MySQL 8.x corriendo + BD creada: CREATE DATABASE brujabeer_db;
#
# spring.datasource.url=jdbc:mysql://localhost:3306/brujabeer_db?useSSL=false&serverTimezone=America/Argentina/Cordoba&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=${DB_PASSWORD:}

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# update  = crea/modifica tablas al arrancar SIN borrar datos (ideal para dev)
# create  = borra y recrea todo al arrancar          (¡PELIGROSO!)
# validate= solo verifica que el schema sea correcto (ideal para producción)
spring.jpa.hibernate.ddl-auto=update

# Dialecto: H2 se auto-detecta. Descomentar si se usa MySQL:
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Muestra las queries SQL en consola (útil para debug, desactivar en prod)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Naming strategy: Spring Boot default (camelCase → snake_case)
# Las entidades usan @Column(name="...") explícito, así que esto es consistente.
spring.jpa.hibernate.naming.physical-strategy=\
  org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ── H2 Console (acceso web para debug de la BD) ──────────────────────────────
# Descomentar para acceder a http://localhost:8082 y ver las tablas:
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ── Logging ───────────────────────────────────────────────────────────────────
spring.main.banner-mode=off

logging.level.root=WARN
logging.level.com.brujabeer=INFO

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  BrujaBeer Recetario — application.properties                           ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# ── CRÍTICO: Desactivar el servidor web embebido ──────────────────────────────
# Sin esta línea, Spring Boot intentará arrancar Tomcat y fallará porque
# no tenemos spring-boot-starter-web en el pom.xml.
spring.main.web-application-type=none

# ── Base de Datos MySQL ───────────────────────────────────────────────────────
# Creá la base de datos primero:  CREATE DATABASE brujabeer_db CHARACTER SET utf8mb4;
spring.datasource.url=jdbc:mysql://localhost:3306/brujabeer_db\
  ?useSSL=false\
  &serverTimezone=America/Argentina/Cordoba\
  &allowPublicKeyRetrieval=true\
  &characterEncoding=UTF-8

spring.datasource.username=root
spring.datasource.password=Silin1977.

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones HikariCP (viene con Spring Boot Data JPA)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# update  = crea/modifica tablas al arrancar sin borrar datos (ideal para dev)
# create  = borra y recrea todo al arrancar          (¡PELIGROSO en producción!)
# validate= solo verifica que el schema sea correcto (ideal para producción)
spring.jpa.hibernate.ddl-auto=update

# Dialecto explícito para MySQL 8.x con Hibernate 6
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Muestra las queries SQL en consola (útil para debug, desactivar en prod)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Naming strategy: convierte camelCase → snake_case en la BD automáticamente
# Ej: volumenLitros → volumen_litros
spring.jpa.hibernate.naming.physical-strategy=\
  org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ── Logging ───────────────────────────────────────────────────────────────────
# Silencia el banner ASCII de Spring Boot (más prolijo en desktop)
spring.main.banner-mode=off

logging.level.root=WARN
logging.level.com.brujabeer=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
